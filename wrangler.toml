name = "know-me"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]
[[d1_databases]]
binding = "DB"
database_name = "know-me"
database_id = "a0d881af-32fb-489b-94cd-0b7abc92c1f9"
migrations_dir = "migrations"
[vars]
ADMIN_USER_IDS = "0d4c906f-1b15-487a-9f33-0fe43b3e9e4e"

[triggers]
crons = ["17 3 * * *"]


[[durable_objects.bindings]]
name = "AUTH_SERVICE"
class_name = "AuthService"

[[migrations]]
tag = "auth-do-v1"
new_sqlite_classes = ["AuthService"]

